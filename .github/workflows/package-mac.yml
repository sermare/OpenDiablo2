name: Package macOS app

# Builds OpenDiablo2.app (arm64) and keeps the zip and dmg as a workflow artifact only.
# Runs only on a version tag (v*) or a manual dispatch, never on ordinary pushes.
# Nothing is published as a release. The app contains no Diablo II files: on
# first run the player points it at their own installation.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: package-mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: OpenDiablo2.app (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build, sign (ad hoc) and zip
        run: ZIP=1 scripts/make-app.sh
      - name: Check the bundle (structure, Info.plist, arm64, codesign, no game files)
        run: scripts/check_app_bundle.sh dist/OpenDiablo2.app
      - name: Build the disk image
        run: scripts/make-dmg.sh dist/OpenDiablo2.app
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDiablo2-macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
