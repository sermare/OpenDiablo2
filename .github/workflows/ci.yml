name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes a running or queued run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packages that need neither a display, cgo (ebiten/glfw/oto) nor game data.
  # Linux only builds and tests these; macOS builds and tests everything.
  PURE_PKGS: >-
    ./d2common
    ./d2common/d2cache/...
    ./d2common/d2calculation/...
    ./d2common/d2combat/...
    ./d2common/d2data/...
    ./d2common/d2datautils/...
    ./d2common/d2daynight/...
    ./d2common/d2enum/...
    ./d2common/d2fileformats/...
    ./d2common/d2geom/...
    ./d2common/d2interface/...
    ./d2common/d2loader/asset/...
    ./d2common/d2loader/filesystem/...
    ./d2common/d2loader/mpq/...
    ./d2common/d2math/...
    ./d2common/d2path/...
    ./d2common/d2resource/...
    ./d2common/d2trade/...
    ./d2common/d2util/assets/...
    ./d2core/d2config
    ./d2core/d2item
    ./d2core/d2item/d2drop
    ./d2core/d2map/d2mapgen/d2wilderness
    ./d2core/d2stats
    ./d2networking/d2gs
    ./d2networking/d2client/d2clientconnectiontype
    ./d2networking/d2netpacket/d2netpackettype
    ./d2script
    ./d2thread
    ./d2game/d2autoscript

jobs:
  hygiene:
    name: Repo hygiene (no game files, no decompiled code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_repo_hygiene.sh
        run: scripts/check_repo_hygiene.sh

  gofmt:
    name: gofmt (changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # Older files in the repo are not gofmt-clean and are deliberately left alone:
      # only .go files added or modified since the base are checked.
      - name: gofmt -l on changed .go files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base: $base"
          files="$(git diff --name-only --diff-filter=AM "$base" HEAD -- '*.go')"
          if [ -z "$files" ]; then echo "no changed .go files"; exit 0; fi
          echo "$files"
          out="$(echo "$files" | xargs gofmt -l)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

  linux-pure:
    name: Linux (pure packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: build
        run: go build $PURE_PKGS
      - name: vet
        run: go vet $PURE_PKGS
      - name: test
        run: go test $PURE_PKGS

  # Optional: never blocks a merge (continue-on-error). Short native fuzz run of every testing.F
  # target with synthetic seeds, plus the race detector on the concurrent packages.
  fuzz-smoke:
    name: Fuzz smoke + race (optional)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: fuzz_smoke.sh (10s per target)
        env:
          FUZZTIME: 10s
        run: |
          unset D2_TABLES D2S_SAMPLE_BODY D2S_SAMPLE_BODY_JSON
          scripts/fuzz_smoke.sh
      - name: go test -race (d2common d2core d2game d2networking)
        run: |
          unset D2_TABLES D2_DS1_ROOT D2S_SAMPLE_BODY D2S_SAMPLE_BODY_JSON
          go test -race ./d2common/... ./d2core/... ./d2game/... ./d2networking/...
      - name: failing fuzz inputs
        if: failure()
        run: git status --porcelain -- '*/testdata/fuzz/*'

  macos:
    name: macOS arm64 (vet + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true # caches the module cache and the Go build cache
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      # Tests that need D2_TABLES / D2_DS1_ROOT / D2S_SAMPLE_BODY skip themselves
      # when those are unset (no game data on CI); the skips are listed below.
      - name: test
        run: |
          unset D2_TABLES D2_DS1_ROOT D2S_SAMPLE_BODY D2S_SAMPLE_BODY_JSON
          set -o pipefail
          go test -v ./... 2>&1 | tee test.log | grep -E '^(ok|FAIL|---\s*FAIL|panic)' || true
          if grep -qE '^(FAIL|--- FAIL|panic)' test.log; then echo "tests failed"; grep -E '^(FAIL|--- FAIL|panic)' test.log; exit 1; fi
      - name: skipped tests (need game data)
        if: always()
        run: |
          {
            echo "### Skipped tests (game data not available on CI)"
            echo
            echo '```'
            grep -E -- '--- SKIP' test.log || echo "(none)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
